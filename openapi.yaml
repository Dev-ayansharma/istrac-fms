  /users/{id}/approve:
    post:
      summary: Approve registration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Approved, temp password emailed
  /users/{id}/reject:
    post:
      summary: Reject registration with reason
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Rejected
  /users/{id}/force-logout:
    post:
      summary: Invalidate a user's session instantly
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Session invalidated
  /admin/stats:
    get:
      summary: Admin home stats (FE-018)
      responses:
        '200':
          description: Stats cards data
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: integer
                  files:
                    type: integer
                  departments:
                    type: integer
                  storageUsedBytes:
                    type: integer
