openapi: 3.0.3
info:
  title: ISTRAC-FMS API
  version: 1.0.0
  description: 'Phase 1 API contract. Covers every endpoint referenced by FE-001 through
    FE-037 in the Phase 1 task tracker. This spec is the source of truth for both
    frontend (build against it via a mock server) and backend (implement to match
    it) until routes are live.

    '
servers:
- url: http://localhost:3000/api/v1
  description: Local dev
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
        requestId:
          type: string
          format: uuid
    Pagination:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
        hasNext:
          type: boolean
        hasPrev:
          type: boolean
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        employeeId:
          type: string
        role:
          type: string
          enum:
          - SUPER_ADMIN
          - DEPT_ADMIN
          - MEMBER
          - GUEST
        status:
          type: string
          enum:
          - PENDING
          - ACTIVE
          - SUSPENDED
          - REJECTED
        tempPass:
          type: boolean
        createdAt:
          type: string
          format: date-time
    Department:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        hddPath:
          type: string
        archived:
          type: boolean
    FileNode:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        nodeType:
          type: string
          enum:
          - FOLDER
          - FILE
        departmentId:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          nullable: true
        sizeBytes:
          type: integer
          nullable: true
        mimeType:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - ACTIVE
          - ORPHANED
          - DELETED
          - UNREGISTERED
        createdAt:
          type: string
          format: date-time
    Notification:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        message:
          type: string
        category:
          type: string
          enum:
          - Files
          - Approvals
          - System
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    CmsBlock:
      type: object
      properties:
        blockKey:
          type: string
        content:
          type: object
  responses:
    ErrorResponse:
      description: Standard error envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
security:
- bearerAuth: []
paths:
  /auth/register:
    post:
      summary: Submit registration request
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - email
              - employeeId
              - departmentPreference
              - reasonForAccess
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                employeeId:
                  type: string
                departmentPreference:
                  type: string
                reasonForAccess:
                  type: string
      responses:
        '201':
          description: Registration submitted, status PENDING
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /auth/login:
    post:
      summary: Login, receive tokens
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /auth/refresh:
    post:
      summary: Rotate refresh token (httpOnly cookie based)
      security: []
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
  /auth/logout:
    post:
      summary: Invalidate refresh token
      responses:
        '204':
          description: Logged out
  /auth/forgot-password:
    post:
      summary: Initiate password reset
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
      responses:
        '200':
          description: If this email exists, a reset link was sent
  /auth/reset-password:
    post:
      summary: Complete password reset with token
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          description: Password updated
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /auth/change-password:
    post:
      summary: Forced or voluntary password change
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          description: Password changed
  /users:
    get:
      summary: List all users (paginated)
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: pageSize
