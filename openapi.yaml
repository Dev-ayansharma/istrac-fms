openapi: 3.0.3
info:
  title: ISTRAC-FMS API
  version: 1.0.0
  description: >
    Phase 1 API contract. Covers every endpoint referenced by FE-001 through
    FE-037 in the Phase 1 task tracker. This spec is the source of truth for
    both frontend (build against it via a mock server) and backend
    (implement to match it) until routes are live.
servers:
  - url: http://localhost:3000/api/v1
    description: Local dev

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
        requestId: { type: string, format: uuid }

    Pagination:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
        hasNext: { type: boolean }
        hasPrev: { type: boolean }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        employeeId: { type: string }
        role: { type: string, enum: [SUPER_ADMIN, DEPT_ADMIN, MEMBER, GUEST] }
        status: { type: string, enum: [PENDING, ACTIVE, SUSPENDED, REJECTED] }
        tempPass: { type: boolean }
        createdAt: { type: string, format: date-time }

    Department:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        hddPath: { type: string }
        archived: { type: boolean }

    FileNode:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        nodeType: { type: string, enum: [FOLDER, FILE] }
        departmentId: { type: string, format: uuid }
        parentId: { type: string, format: uuid, nullable: true }
        sizeBytes: { type: integer, nullable: true }
        mimeType: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, ORPHANED, DELETED, UNREGISTERED] }
        createdAt: { type: string, format: date-time }

    Notification:
      type: object
      properties:
        id: { type: integer }
        type: { type: string }
        message: { type: string }
        category: { type: string, enum: [Files, Approvals, System] }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    CmsBlock:
      type: object
      properties:
        blockKey: { type: string }
        content: { type: object }

  responses:
    ErrorResponse:
      description: Standard error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

security:
  - bearerAuth: []

paths:
  # ---------- AUTH (FE-012, FE-013, FE-014, FE-015) ----------
  /auth/register:
    post:
      summary: Submit registration request
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, email, employeeId, departmentPreference, reasonForAccess]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                employeeId: { type: string }
                departmentPreference: { type: string }
                reasonForAccess: { type: string }
      responses:
        '201': { description: "Registration submitted, status PENDING" }
        '400': { $ref: '#/components/responses/ErrorResponse' }

  /auth/login:
    post:
      summary: Login, receive tokens
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/ErrorResponse' }

  /auth/refresh:
    post:
      summary: Rotate refresh token (httpOnly cookie based)
      security: []
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }

  /auth/logout:
    post:
      summary: Invalidate refresh token
      responses:
        '204': { description: Logged out }

  /auth/forgot-password:
    post:
      summary: Initiate password reset
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
      responses:
        '200': { description: "If this email exists, a reset link was sent" }

  /auth/reset-password:
    post:
      summary: Complete password reset with token
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
                newPassword: { type: string }
      responses:
        '200': { description: Password updated }
        '400': { $ref: '#/components/responses/ErrorResponse' }

  /auth/change-password:
    post:
      summary: Forced or voluntary password change
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword: { type: string }
                newPassword: { type: string }
      responses:
        '200': { description: Password changed }

  # ---------- USERS / ADMIN (FE-017, FE-018, FE-019, FE-020) ----------
  /users:
    get:
      summary: List all users (paginated)
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 50 } }
        - { name: status, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { type: string } }
      responses:
        '200':
          description: Paginated user list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  pagination: { $ref: '#/components/schemas/Pagination' }

  /users/pending:
    get:
      summary: List pending registrations (Approval Queue — FE-019)
      responses:
        '200':
          description: Pending users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }

  /users/{id}/approve:
    post:
      summary: Approve registration
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: "Approved, temp password emailed" }

  /users/{id}/reject:
    post:
      summary: Reject registration with reason
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200': { description: Rejected }

  /users/{id}/force-logout:
    post:
      summary: Invalidate a user's session instantly
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Session invalidated }
  
  /users/{id}/suspend:
    post:
      summary: Suspend a user account
      parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: User suspended, session invalidated }

  /admin/stats:
    get:  
      summary: Admin home stats (FE-018)
      responses:
        '200':
          description: Stats cards data
          content:
            application/json:
              schema:
                type: object
                properties:
                  users: { type: integer }
                  files: { type: integer }
                  departments: { type: integer }
                  storageUsedBytes: { type: integer }

  # ---------- DEPARTMENTS (FE-021) ----------
  /departments:
    get:
      summary: List departments (scoped to user access)
      responses:
        '200':
          description: Department list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Department' }
    post:
      summary: Create department
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                hddPath: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Department' }
  /departments/{id}:
    put:
      summary: Update department (name, hddPath, or archived status)
      parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                hddPath: { type: string }
                archived: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Department' }
        '409':
          description: Name already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /departments/{id}/members:
    post:
      summary: Add user to department
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userId: { type: string }
                accessLevel: { type: string, enum: [READ_ONLY, READ_WRITE, READ_WRITE_DELETE] }
      responses:
        '200': { description: Member added }

  # ---------- FILES (FE-021 through FE-025, FE-031 through FE-034) ----------
  /browse/{deptId}:
    get:
      summary: Navigate folder tree (FE-032)
      parameters:
        - { name: deptId, in: path, required: true, schema: { type: string } }
        - { name: parentId, in: query, schema: { type: string } }
      responses:
        '200':
          description: Files/folders at this level
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FileNode' }

  /browse/{deptId}/folder:
    post:
      summary: Create subfolder
      parameters:
        - { name: deptId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                parentId: { type: string, nullable: true }
      responses:
        '201': { description: Folder created }

  /files/upload:
    post:
      summary: Upload file (single-shot, <10MB — FE-023)
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                departmentId: { type: string }
                parentId: { type: string, nullable: true }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileNode' }

  /files/{id}/download:
    get:
      summary: Stream file bytes (FE-033)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: File stream
          content:
            application/octet-stream: {}

  /files/{id}:
    delete:
      summary: Soft delete file
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted }

  /files/{id}/versions:
    get:
      summary: List version history (FE-024)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Version list
          content:
            application/json:
              schema: { type: array, items: { type: object } }

  /files/bulk-delete:
    post:
      summary: Bulk soft-delete files
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fileIds: { type: array, items: { type: string } }
      responses:
        '200': { description: Deleted, with per-item failure list if any }

  /files/bulk-tag:
    post:
      summary: Bulk add or remove tags
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fileIds: { type: array, items: { type: string } }
                tags: { type: array, items: { type: string } }
                action: { type: string, enum: [add, remove] }
      responses:
        '200': { description: Tags applied }
  /files/upload/chunk:
    post:
      summary: Upload a single chunk
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                chunk: { type: string, format: binary }
                fileName: { type: string }
                chunkIndex: { type: integer }
                totalChunks: { type: integer }
                departmentId: { type: string }
                parentId: { type: string, nullable: true }
      responses:
        '200': { description: Chunk received }

  /files/upload/complete:
    post:
      summary: Finalize a chunked upload — server assembles, validates checksum, commits
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fileName: { type: string }
                departmentId: { type: string }
                parentId: { type: string, nullable: true }
                checksum: { type: string }
                totalChunks: { type: integer }
      responses:
        '201':
          description: File committed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileNode' }
        '409':
          description: Checksum mismatch
  /admin/audit-logs:
    get:
      summary: View audit log (FE-025, paginated)
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Audit log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { type: object } }
                  pagination: { $ref: '#/components/schemas/Pagination' }

  # ---------- SEARCH (FE-034) ----------
  /search:
    get:
      summary: Full-text search (paginated, scoped to accessible departments)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: dept, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string } }
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/FileNode' } }
                  pagination: { $ref: '#/components/schemas/Pagination' }

  # ---------- CMS (FE-007 through FE-011, FE-027, FE-028) ----------
  /cms:
    get:
      summary: Get all CMS content blocks (public)
      security: []
      responses:
        '200':
          description: CMS blocks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CmsBlock' }

  /cms/{blockKey}:
    put:
      summary: Update a CMS block (FE-027)
      parameters:
        - { name: blockKey, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: object }
      responses:
        '200': { description: "Updated, pushed via WebSocket to landing page" }

  # ---------- NOTIFICATIONS (FE-035, FE-036) ----------
  /notifications:
    get:
      summary: Paginated notification inbox
      parameters:
        - { name: category, in: query, schema: { type: string, enum: [Files, Approvals, System] } }
        - { name: unread, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Notification list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Notification' } }

  /notifications/count:
    get:
      summary: Unread count (bell badge)
      responses:
        '200':
          description: Count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }

  /notifications/mark-all-read:
    post:
      summary: Mark all as read
      responses:
        '200': { description: Marked read }

  /notifications/{id}/read:
    patch:
      summary: Mark single notification read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Marked read }

  # ---------- SYSTEM / ADMIN CONFIG (FE-029, FE-030) ----------
  /admin/settings:
    get:
      summary: Get runtime config values
      responses:
        '200':
          description: Config key-value pairs
          content:
            application/json:
              schema: { type: object }

  /admin/settings/{key}:
    put:
      summary: Update a runtime config value
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                value: { type: string }
      responses:
        '200': { description: Updated }

  /roles:
    get:
      summary: List custom roles for a department (FE-030)
      parameters:
        - { name: deptId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Custom roles
          content:
            application/json:
              schema: { type: array, items: { type: object } }
    post:
      summary: Create a custom role
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                deptId: { type: string }
                name: { type: string }
                permissions: { type: array, items: { type: string } }
      responses:
        '201': { description: Created }

  # ---------- HEALTH ----------
  /health:
    get:
      summary: Application health check
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }