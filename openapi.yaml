  /files/{id}/download:
    get:
      summary: Stream file bytes (FE-033)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: File stream
          content:
            application/octet-stream: {}
  /files/{id}:
    delete:
      summary: Soft delete file
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted
  /files/{id}/log-access:
    post:
      summary: Log a file access event (preview, metadata view) to the audit log
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum:
                  - PREVIEW
                  - DOWNLOAD
      responses:
        '204':
          description: Logged
