  /roles:
    get:
      summary: List custom roles for a department (FE-030)
      parameters:
      - name: deptId
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Custom roles
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
              example:
              - id: r1
                departmentId: d1a1a1a1-0000-0000-0000-000000000001
                name: Senior Archivist
                description: Can tag, version, and share files but not delete
                permissions:
                - FILE_VIEW
                - FILE_DOWNLOAD
                - FILE_UPLOAD
                - FILE_VERSION
                - FILE_TAG
                - FILE_SHARE
                memberCount: 3
              - id: r2
                departmentId: d1a1a1a1-0000-0000-0000-000000000001
                name: Auditor
                description: Read-only access plus audit log export
                permissions:
                - FILE_VIEW
                - AUDIT_VIEW
                - AUDIT_EXPORT
                memberCount: 1
              - id: r3
                departmentId: d1a1a1a1-0000-0000-0000-000000000005
                name: Operations Coordinator
                description: Can view, upload and manage operational reports.
                permissions:
                - FILE_VIEW
                - FILE_DOWNLOAD
                - FILE_UPLOAD
                - FILE_VERSION
                memberCount: 5
              - id: r4
                departmentId: d1a1a1a1-0000-0000-0000-000000000002
                name: HR Viewer
                description: Read-only access to HR documents.
                permissions:
                - FILE_VIEW
                - FILE_DOWNLOAD
                memberCount: 4
    post:
      summary: Create a custom role
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                deptId:
                  type: string
                name:
                  type: string
                permissions:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Created
