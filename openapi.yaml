      responses:
        '200':
          description: CMS blocks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CmsBlock'
              example:
              - blockKey: hero
                content:
                  title: ISTRAC-FMS
                  subtitle: Centralized, permission-controlled file management for
                    ISTRAC departments.
                  ctaText: Request Access
              - blockKey: announcements
                content:
                  visible: true
                  text: Scheduled maintenance tonight from 11 PM to 1 AM IST.
                  backgroundColor: orange
              - blockKey: banner
                content:
                  visible: false
                  title: ''
                  subtitle: ''
                  ctaText: ''
              - blockKey: feature_strip
                content:
                  items:
                  - icon: Shield
                    title: Secure & Reliable
                    description: Enterprise-grade access control and audit trails.
                    visible: true
                  - icon: Search
                    title: Fast Search
                    description: Full-text search scoped to your assigned departments.
                    visible: true
                  - icon: Clock
                    title: Version History
                    description: Every change tracked, nothing ever silently overwritten.
                    visible: true
              - blockKey: gallery
                content:
                  items:
                  - url: /images/operations-dashboard.png
                    label: Operations Dashboard
                    caption: Monitor spacecraft operations and mission resources.
                  - url: /images/file-management.png
                    label: File Management
                    caption: Securely manage department files and resources.
                  - url: /images/audit-log.png
                    label: Audit & Security
                    caption: Maintain complete visibility of file activity and changes.
              - blockKey: contact_info
                content:
                  email: support@istrac.local
                  phone: +91-80-2508-0000
              - blockKey: org_overview
                content:
                  text: ISTRAC (ISRO Telemetry, Tracking and Command Network) manages
                    satellite operations and mission support.
